# /etc/nginx/conf.d/clock-usage-relay.conf on the front nginx proxy server (http context).
# Replace clock.example.com, the certificate paths and RELAY_HOST:8787 before use.

limit_req_zone $binary_remote_addr zone=clock_usage:1m rate=6r/m;

upstream clock_usage_relay {
    server RELAY_HOST:8787;
    keepalive 2;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clock.example.com;

    ssl_certificate     /etc/letsencrypt/live/clock.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clock.example.com/privkey.pem;
    # ESP8266 BearSSL speaks TLS 1.2 only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/clock-usage-relay.access.log;
    error_log  /var/log/nginx/clock-usage-relay.error.log warn;

    location = /clock/usage {
        limit_except GET { deny all; }
        limit_req zone=clock_usage burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://clock_usage_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
