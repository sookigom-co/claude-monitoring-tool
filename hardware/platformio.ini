; SmartClock firmware for the SD Pro clock (ESP-12F / ESP8266, 4MB flash, ST7789 240x240).

[platformio]
default_envs = smartclock

[lcd]
; LCD wiring. Every pin and panel option lives here; change this one line and rebuild.
build_flags = -DLCD_MOSI=13 -DLCD_SCLK=14 -DLCD_CS=-1 -DLCD_DC=0 -DLCD_RST=2 -DLCD_BL=5 -DLCD_BL_ACTIVE_LOW=1 -DLCD_SPI_MODE=3 -DLCD_INVERT=1 -DLCD_BGR=0 -DLCD_ROTATION=0

[common]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dout
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
build_flags =
  ${lcd.build_flags}
  -DFW_VERSION=\"0.4.0\"
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -DNDEBUG

[env:smartclock]
extends = common
lib_deps = bblanchon/ArduinoJson@7.4.2
build_src_filter = +<*> -<diag.cpp>

[env:smartclock-ota]
extends = env:smartclock
upload_protocol = espota
upload_port = smartclock-XXXX.local
upload_flags = --auth=${sysenv.SMARTCLOCK_OTA_PASS}

[env:lcd-diag]
extends = common
build_src_filter = -<*> +<lcd.cpp> +<fonts_gen.cpp> +<diag.cpp>
